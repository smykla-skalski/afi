name: anthropic-federated-test

# Temporary verification, meant to be deleted once it has passed once.
#
# It proves the one thing no local test can: that `afi` performs the workload
# identity federation exchange itself. The console's generated snippet does this
# with an `actions/github-script` step to fetch the OIDC token and a `curl` to
# `/v1/oauth/token`; both are absent here on purpose. `afi` reads
# ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN from the runner, mints an access token, and
# sends it as a bearer with no `x-api-key`.
#
# It runs the published release binary rather than building, so a pass also
# confirms the release artifact actually works on a clean runner.
#
# Manual only, and the federation rule is scoped to `workflow_dispatch` on
# refs/heads/main, so a run from any other ref or trigger is rejected during the
# exchange.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to send"
        required: false
        default: "List the top-level directories in this repository, then read the first 20 lines of AGENTS.md and tell me the file-length cap it states."
      version:
        description: "Release tag to test (e.g. v0.1.0)"
        required: false
        default: v0.1.0

# id-token: write is what lets the runner mint an OIDC token at all. Without it
# afi has no identity to exchange and fails with a config error naming it.
permissions:
  contents: read
  id-token: write

jobs:
  ask:
    name: Federated request
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # musl so the binary does not depend on the runner's glibc version.
      - name: Install the released afi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          asset=afi-x86_64-unknown-linux-musl
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${asset}.tar.gz" \
            --pattern "${asset}.sha256" \
            --dir dist
          # The release publishes a checksum; verifying it makes this a real test
          # of the artifact rather than of whatever the CDN happened to serve.
          (cd dist && sha256sum --check "${asset}.sha256")
          tar -xzf "dist/${asset}.tar.gz" -C dist
          # Do not assume the archive layout - find the binary wherever it landed.
          binary="$(find dist -type f -name afi -perm -u+x -print -quit)"
          if [[ -z "${binary}" ]]; then
            echo "::error::no afi binary in ${asset}.tar.gz"
            find dist -type f
            exit 1
          fi
          # A writable bin dir on PATH, so this needs no sudo.
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${binary}" "${HOME}/.local/bin/afi"
          echo "${HOME}/.local/bin" >>"${GITHUB_PATH}"
          file "${HOME}/.local/bin/afi"

      - name: Write the prompt
        env:
          PROMPT: ${{ inputs.prompt }}
        run: printf '%s\n' "${PROMPT}" >prompt.txt

      # The four ids are not secrets - Anthropic's own generated snippet commits
      # them to the repository. The only credential involved is the OIDC token,
      # which never leaves the runner.
      - name: Ask Claude over a federated token
        env:
          AFI_ACTIVE: anthropic
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01RpMh9JLAstwdpEex22C33E
          ANTHROPIC_ORGANIZATION_ID: bb02f40b-e260-46ea-ad8d-b6567802c4b0
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_011zzTfs5tiPL6gF4VUTo9Et
          ANTHROPIC_WORKSPACE_ID: wrkspc_013a8oDHAijdUumWpJ7kqWs9
          # Without this every write and bash call stops for approval and the
          # job hangs until it times out.
          AFI_APPROVAL: yolo
        run: afi --source anthropic --yolo -f prompt.txt

      # afi's traffic log records prompts and chunk counts, never headers. Fail
      # loudly if a bearer or assertion ever shows up in it.
      - name: Check the traffic log for leaked credentials
        if: always()
        run: |
          set -euo pipefail
          log="${HOME}/.afi/logs/traffic.jsonl"
          if [[ ! -f "${log}" ]]; then
            echo "no traffic log written"
            exit 0
          fi
          if grep -Eq 'Bearer |eyJ[A-Za-z0-9_-]{10,}' "${log}"; then
            echo "::error::a credential appears in ${log}"
            exit 1
          fi
          echo "no credential in the traffic log ($(wc -l <"${log}") lines)"

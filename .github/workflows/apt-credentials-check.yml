name: apt-credentials-check

# Proves this repository can still authenticate to the apt registry and reach
# the package repository, without publishing anything.
#
# The release workflow only exercises those credentials when it is actually
# publishing, which is after it has pushed a tag and created a GitHub release.
# A credential that has expired, been revoked, or had its OIDC claim narrowed
# would therefore surface at the worst possible moment. Run this first instead.
#
# Manual only. It costs a runner minute and answers one question, so there is
# nothing to gain from running it on a schedule or on every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check apt publishing credentials
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    permissions:
      contents: read
      # Cloudsmith exchanges this token for a short-lived credential.
      id-token: write
    steps:
      - name: Check the configuration is present
        env:
          CLOUDSMITH_WORKSPACE: ${{ vars.CLOUDSMITH_WORKSPACE }}
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
          CLOUDSMITH_SERVICE_SLUG: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDSMITH_WORKSPACE}" ]] || missing+=(CLOUDSMITH_WORKSPACE)
          [[ -n "${CLOUDSMITH_REPOSITORY}" ]] || missing+=(CLOUDSMITH_REPOSITORY)
          [[ -n "${CLOUDSMITH_SERVICE_SLUG}" ]] || missing+=(CLOUDSMITH_SERVICE_SLUG)
          if (( ${#missing[@]} )); then
            echo "::error::missing repository variables: ${missing[*]}. See the apt setup notes in release.yml."
            exit 1
          fi

      # verify-auth runs `cloudsmith whoami`, so the token exchange itself has
      # to succeed before this step can pass.
      - name: Authenticate over OIDC
        uses: cloudsmith-io/cloudsmith-cli-action@ad73fafb92e3e29a5166c529464c2df7658a608e # v3.1.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_WORKSPACE }}
          oidc-service-slug: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
          verify-auth: true

      # Authenticating proves the identity resolves; listing proves that identity
      # can actually see the repository it is expected to publish to.
      - name: Read the package repository
        env:
          WORKSPACE: ${{ vars.CLOUDSMITH_WORKSPACE }}
          REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
        run: cloudsmith list packages "${WORKSPACE}/${REPOSITORY}" --query 'name:afi'

name: backfill-release

# Build and publish a release for a tag that already exists and has none.
#
# v0.3.0 is why this exists. It was tagged, the run that tagged it did not
# survive to create the release, and the ordinary pipeline cannot recover from
# that: it keys off the manifest version, and by the time anyone notices, main
# has moved on. The result is a tag users can fetch and nothing to install.
#
# release.yml can no longer produce that state, because it builds everything
# before it tags. This is for the tags that predate it, and for a tag pushed by
# hand.
#
# What it does not do is touch the apt repository. A backfilled version is by
# definition older than what is already published there, apt always serves the
# newest, so pushing it would change nothing for any user while adding a package
# nobody resolves to. The GitHub release is the gap worth filling.
#
# It also does not move the tag, rewrite the changelog, or bump anything. The tag
# stays where it points and the release is built from exactly that commit.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag with no release (e.g. v0.3.0)"
        required: true
        type: string
      dry_run:
        description: "Build everything, publish nothing."
        type: boolean
        default: false

permissions:
  contents: read

# Shares release.yml's group. A backfill and a release both write to the
# releases API and neither should be running while the other is.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    outputs:
      version: ${{ steps.plan.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # The target list and the packaging tooling come from the default branch,
      # not from the tag: a tag old enough to need backfilling predates them.
      # Checked out into a subdirectory, which git reports as untracked, and
      # build.rs asks `git status --untracked-files=no`, so this does not mark
      # the build dirty.
      - name: Check out the current tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-tooling
          persist-credentials: false

      - name: Work out what to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Only fills a gap. A published release already has assets and an
          # audience, and rebuilding over it would replace bytes people have
          # already downloaded and checked.
          if gh release view "${TAG}" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::${TAG} already has a published release. This workflow only fills gaps."
            exit 1
          fi

          version="$(./scripts/cargo-version.sh)"
          if [[ "v${version}" != "${TAG}" ]]; then
            echo "::error::${TAG} has ${version} in its manifest. Refusing to guess which is right."
            exit 1
          fi

          {
            echo "version=${version}"
            echo "matrix={\"include\":$(./.release-tooling/scripts/release-targets.sh --matrix)}"
          } >>"${GITHUB_OUTPUT}"
          echo "Backfilling ${TAG} (${version})."

  build:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os == 'macos' && fromJSON(vars.MACOS_RUNNER_LABEL || '["macos-15"]') || fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Check out the current tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-tooling
          persist-credentials: false

      - name: Build
        id: build
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: afi
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build_tool }}
          locked: true
          checksum: sha256
          tar: unix
          zip: none
          include: README.md,LICENSE,CHANGELOG.md
          dry-run: true
          dry-run-intended: true

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Set up QEMU
        if: matrix.os == 'linux'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Invoked directly rather than through the mise task, because the task
      # belongs to the default branch's lane and this checkout is the tag's.
      # smoke-archive.sh takes everything it needs as arguments, so it runs
      # correctly from anywhere.
      - name: Smoke-test the archive
        env:
          ARCHIVE: ${{ steps.build.outputs.tar }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: ./.release-tooling/scripts/smoke-archive.sh "${ARCHIVE}" "${TARGET}" "${VERSION}"

      # The tag's own packaging, not the default branch's: this has to produce
      # the package that version would have produced.
      - name: Build the Debian package
        if: matrix.deb
        id: deb
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          path="$(mise run deb "${TARGET}" | tail -1)"
          test -f "${path}"
          echo "path=${path}" >>"${GITHUB_OUTPUT}"

      - name: Verify the Debian package installs
        if: matrix.deb
        env:
          DEB: ${{ steps.deb.outputs.path }}
        run: mise run deb:verify "${DEB}"

      - name: Stage the artifacts
        env:
          TAR: ${{ steps.build.outputs.tar }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          DEB: ${{ steps.deb.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mv "${TAR}" "${SHA256}" dist/
          [[ -z "${DEB}" ]] || mv "${DEB}" dist/
          ls -l dist

      - name: Upload the built artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [plan, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Check out the current tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-tooling
          persist-credentials: false

      - name: Collect the built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # The same question release.yml's verify job asks, minus the apt half:
      # is everything the target list promises actually here. Asked before the
      # upload, because an incomplete backfill should not become a release.
      - name: Check the artifacts are complete
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          missing=0
          while read -r want; do
            if [[ -f "dist/${want}" ]]; then
              echo "  ok       ${want}"
            else
              echo "::error::the build produced no ${want}"
              missing=$((missing + 1))
            fi
          done < <(./.release-tooling/scripts/release-targets.sh --assets "$(./scripts/deb-version.sh)")
          (( missing == 0 )) || exit 1

      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb

      # Draft first, then flipped, for the same reason release.yml does it: a
      # release should not exist empty even for the minute an upload takes.
      #
      # Not marked latest. A backfilled version is older than what is already
      # published, and `releases/latest` should keep pointing at the newest.
      - name: Create and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail

          # That version's own changelog section, so the release notes match
          # CHANGELOG.md the way every other release's do. awk rather than a
          # parser: the headings are generated and their shape is fixed.
          notes="$(
            awk -v v="${VERSION}" '
              $0 ~ "^## \\[" v "\\]" { inside = 1; next }
              inside && /^## / { exit }
              inside { print }
            ' CHANGELOG.md
          )"

          # The heredoc body is indented to the block scalar, not to column 0.
          # YAML strips the block's common indentation, so the shell still sees
          # it flush left; written flush left here it would end the scalar.
          {
            printf '%s\n' "${notes}"
            cat <<'FOOTER'

          ---

          Backfilled. This tag was created without a release, and the archives
          and packages below were built from it afterwards by
          `backfill-release.yml`. They carry build provenance like any other
          release:

              gh attestation verify <file> --repo smykla-skalski/afi

          Not published to the apt repository: a newer version is already
          there, and apt always serves the newest.
          FOOTER
          } >notes.md

          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Reusing the existing draft for ${TAG}."
            gh release edit "${TAG}" --repo "${REPO}" --notes-file notes.md
          else
            gh release create "${TAG}" \
              --repo "${REPO}" \
              --title "${TAG}" \
              --notes-file notes.md \
              --draft \
              --verify-tag
          fi

          gh release upload "${TAG}" dist/* --repo "${REPO}" --clobber

          gh release edit "${TAG}" --repo "${REPO}" --draft=false --latest=false
          echo "Published https://github.com/${REPO}/releases/tag/${TAG}"

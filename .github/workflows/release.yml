name: release

# Releases decide their own version. release-plz reads the conventional-commit
# history, works out the next version from it, rewrites Cargo.toml, Cargo.lock,
# and CHANGELOG.md, tags, and writes that version's changelog into the release
# notes. Nobody edits a version by hand, so the manifest, the tag, the changelog,
# and the Debian packages cannot disagree about what shipped.
#
# Nothing becomes public until every artifact exists.
#
# That ordering is the whole design, and it is what the previous arrangement got
# backwards. It tagged and published a release first and built the binaries
# afterwards, so a release was live and empty for as long as the builds took, and
# a build that failed left the empty release behind. Measured on v0.4.0: the
# release was published at 20:37:48Z carrying one of five platforms, and the last
# asset landed at 04:15:57Z the following morning. v0.3.0 came out of the same
# hole with a tag and no release at all. So:
#
#   plan     work out the version. Touch nothing outside the runner.
#   build    compile, smoke-test, and package every target. Still nothing public.
#   release  commit the bump, tag, open a *draft* release, attach and attest.
#   apt      push the Debian packages.
#   verify   assert the release and the apt repository agree.
#   publish  flip the draft. This is the first moment a user can see anything.
#
# A failure anywhere before `publish` leaves a draft, which is invisible to
# everyone without push access, and a tag. Re-running the workflow resumes.
#
# Daily rather than on every push to main: a release rebuilds five targets,
# packages two of them, and pushes to the apt repository, which is a lot of
# motion to attach to a single merge. Once a day collects a day's work into one
# version. On a quiet day the job finds nothing releasable and stops.
#
# `release_commits` in release-plz.toml decides what counts: feat, fix, perf, and
# refactor. docs, chore, test, style, and ci land on main and wait for the next
# release that something else triggers.
#
# The manual trigger is the escape hatch, for releasing off-schedule, pinning an
# exact version, or forcing one when the history says there is nothing to do.
# A dry run now runs plan and build in full, which proves every target still
# compiles, packages, and runs, and stops before anything is written.
#
# The target list lives in scripts/release-targets.sh, not here. The build matrix
# and the reconciliation gate both read it, so "what a release contains" has one
# definition instead of one in YAML and none anywhere else.
#
# apt publishing setup, needed once before the first release that publishes:
#
#   1. Create a Cloudsmith workspace and an open-source repository in it. The
#      repository type has to be chosen at creation; it cannot be converted
#      afterwards, and deletion is soft, so the slug stays reserved.
#   2. Create a service account, give it write access to the repository, and add
#      a GitHub OIDC provider to it. Cloudsmith exchanges the token this workflow
#      requests for a short-lived credential, so there is no API key to store.
#   3. Set three repository variables: CLOUDSMITH_WORKSPACE,
#      CLOUDSMITH_REPOSITORY, CLOUDSMITH_SERVICE_SLUG.
#
# The plan job refuses to publish while any of those is unset, so a missing step
# fails before a tag exists rather than halfway through a release.
on:
  schedule:
    # 04:17 UTC. Off the hour on purpose: GitHub queues scheduled jobs across all
    # repositories, and the top of the hour is where everyone else is waiting.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version, no leading v (e.g. 0.3.0). Empty means work it out from the commits."
        required: false
        type: string
      force:
        description: "Release even when no commit since the last tag is releasable."
        type: boolean
        default: false
      dry_run:
        description: "Plan and build everything, publish nothing."
        type: boolean
        default: false

permissions:
  contents: read

# Two releases at once would race on the tag and on the version in Cargo.toml.
# Never cancel one in flight: it may already have pushed a tag or a package.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    outputs:
      released: ${{ steps.plan.outputs.released }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Full history and tags: release-plz compares against the last tag to work
      # out what changed, so a shallow clone would make every release look like
      # the first one.
      #
      # No app token and no persisted credentials. This job writes nothing
      # anywhere, and the identity that can push to main is not needed until the
      # release job, three jobs later.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Everything a release needs in order to finish, asked for at the only
      # point where the answer is still free. release-plz publishes the crate in
      # the same step that creates the tag, and the apt push happens after the
      # release exists, so a credential missing at either of those points leaves
      # a half-finished release behind rather than a failed run.
      - name: Check the publishing configuration
        env:
          CLOUDSMITH_WORKSPACE: ${{ vars.CLOUDSMITH_WORKSPACE }}
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
          CLOUDSMITH_SERVICE_SLUG: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          APP_PRIVATE_KEY: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDSMITH_WORKSPACE}" ]] || missing+=(CLOUDSMITH_WORKSPACE)
          [[ -n "${CLOUDSMITH_REPOSITORY}" ]] || missing+=(CLOUDSMITH_REPOSITORY)
          [[ -n "${CLOUDSMITH_SERVICE_SLUG}" ]] || missing+=(CLOUDSMITH_SERVICE_SLUG)
          if (( ${#missing[@]} )); then
            echo "::error::missing repository variables: ${missing[*]}. See the apt setup notes in this file's header."
            exit 1
          fi

          secrets=()
          [[ -n "${APP_PRIVATE_KEY}" ]] || secrets+=(SMYKLOT_APP_PRIVATE_KEY)
          # Only required while release-plz.toml has `publish = true`, so read
          # that rather than assuming, and let a project that turns publishing
          # off stop needing the secret without anyone editing this file.
          if grep -Eq '^publish[[:space:]]*=[[:space:]]*true' release-plz.toml; then
            [[ -n "${CARGO_REGISTRY_TOKEN}" ]] || secrets+=(CARGO_REGISTRY_TOKEN)
          fi
          if (( ${#secrets[@]} )); then
            echo "::error::missing repository secrets: ${secrets[*]}"
            exit 1
          fi

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # A release should not ship a tree the gate rejects, and this runs before
      # anything is written, tagged, or pushed.
      - name: Run the repository gate
        run: mise run check

      # Advisories and licenses are a property of the day, not of the commit: a
      # tree that passed yesterday can hold a crate that was advised against
      # overnight. Asking here means a release is the thing that notices.
      - name: Run the supply-chain gate
        run: mise run check:supply-chain

      - name: Work out the version
        id: plan
        env:
          AFI_RELEASE_VERSION: ${{ inputs.version }}
          AFI_RELEASE_FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Exit 3 is "nothing releasable", the ordinary outcome of a quiet day.
          set +e
          version="$(mise x -- ./scripts/plan-release.sh)"
          status=$?
          set -e
          if (( status == 3 )); then
            echo "released=false" >>"${GITHUB_OUTPUT}"
            echo "No releasable commit since the last tag. Nothing to do."
            exit 0
          fi
          (( status == 0 )) || exit "${status}"

          # Asked of the API rather than of `git ls-remote`, because the checkout
          # above keeps no credentials and this should not depend on the
          # repository happening to be public.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            echo "::error::Tag v${version} already exists."
            exit 1
          fi

          {
            echo "released=true"
            echo "version=${version}"
            echo "tag=v${version}"
            # The commit every later job builds from. Pinning it means a merge
            # that lands mid-release cannot make the build and the tag disagree
            # about what was compiled.
            echo "sha=$(git rev-parse HEAD)"
            echo "matrix={\"include\":$(./scripts/release-targets.sh --matrix)}"
          } >>"${GITHUB_OUTPUT}"
          echo "Releasing ${version} from $(git rev-parse --short HEAD)."

      - name: Show the planned release
        if: steps.plan.outputs.released == 'true'
        run: git --no-pager diff --stat

      # The bumped manifest, lockfile, and changelog, handed to the build jobs so
      # they compile the version being released rather than the one on main. The
      # release job applies the same three files to make the commit, so what was
      # built and what gets tagged are the same tree.
      - name: Upload the version bump
        if: steps.plan.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bump
          path: |
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.released == 'true'
    runs-on: ${{ matrix.os == 'macos' && fromJSON(vars.MACOS_RUNNER_LABEL || '["macos-15"]') || fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    strategy:
      # Every leg runs even when one fails, so a single broken target reports
      # once with the full picture instead of hiding the state of the other four.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out the planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Apply the version bump
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bump

      # Builds and archives, and does not upload: there is no release to upload
      # to yet, which is the point. dry-run also means no token is handed to this
      # job at all. `dry-run-intended` suppresses the warning the action prints
      # when it notices it is not running from a tag ref, which here is expected.
      - name: Build
        id: build
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: afi
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.build_tool }}
          locked: true
          checksum: sha256
          tar: unix
          zip: none
          include: README.md,LICENSE,CHANGELOG.md
          dry-run: true
          dry-run-intended: true

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # Lets the x86_64 runner execute the arm64 Linux binary, for the smoke test
      # below and for the package install check further down. macOS needs none of
      # it: both Apple targets run on the arm64 runner, natively or under Rosetta.
      - name: Set up QEMU
        if: matrix.os == 'linux'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      # Opens the archive that is about to be published and runs the binary in
      # it, asserting that it reports the version being released and the target
      # the filename claims. Nothing checked either of those before.
      - name: Smoke-test the archive
        env:
          ARCHIVE: ${{ steps.build.outputs.tar }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: mise run smoke "${ARCHIVE}" "${TARGET}" "${VERSION}"

      # Packages the binary the build step already produced, rather than
      # compiling again, so the .deb and the tarball ship identical bytes.
      - name: Build the Debian package
        if: matrix.deb
        id: deb
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # build-deb.sh prints the package path and nothing else, but mise may
          # add a task banner ahead of it, so take the last line.
          path="$(mise run deb "${TARGET}" | tail -1)"
          test -f "${path}"
          echo "path=${path}" >>"${GITHUB_OUTPUT}"
          echo "Built ${path}"

      - name: Verify the Debian package installs
        if: matrix.deb
        env:
          DEB: ${{ steps.deb.outputs.path }}
        run: mise run deb:verify "${DEB}"

      # Gathered into one directory first, rather than listed as three paths on
      # the upload step, because the third is empty for the targets that produce
      # no .deb. Staging makes the artifact's contents explicit and keeps the
      # upload from having to reason about a blank path.
      - name: Stage the artifacts
        env:
          TAR: ${{ steps.build.outputs.tar }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          DEB: ${{ steps.deb.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mv "${TAR}" "${SHA256}" dist/
          [[ -z "${DEB}" ]] || mv "${DEB}" dist/
          ls -l dist

      # One artifact per target, collected by the release job. Everything a
      # release publishes exists here before anything public has been created.
      - name: Upload the built artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  release:
    name: Tag and draft
    needs: [plan, build]
    # A dry run stops here. Everything above it has already proved the release
    # would work; everything below it changes something outside the runner.
    if: needs.plan.outputs.released == 'true' && !inputs.dry_run
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    permissions:
      contents: write
      # Sigstore issues the short-lived certificate that signs the provenance.
      id-token: write
      attestations: write
    steps:
      # The bump lands on main without a pull request, which the branch ruleset
      # otherwise forbids. This app is a bypass actor on that ruleset, so it is
      # the identity that can do it. GITHUB_TOKEN cannot.
      #
      # Scoped to contents. Without a `permission-` input the token would carry
      # every permission the installation holds, which for a release is issues,
      # pull requests, and workflows it has no use for.
      - name: Mint an app token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SMYKLOT_CLIENT_ID || 'Iv23liMyF31aNYay8IXy' }}
          private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}
          permission-contents: write

      # Credentials stay on this checkout on purpose: release-plz pushes the tag
      # over git, so removing them would break the one job that needs them. This
      # is the only job in the workflow that keeps them.
      - name: Check out the planned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Apply the version bump
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bump

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # Through the API rather than git, because the ruleset requires signed
      # commits and a runner has no key to sign with. GitHub signs commits it
      # creates, so the rule is satisfied outright instead of relying on the app
      # being exempt from it. The app's bypass then covers only the missing pull
      # request, which is the one rule it has to.
      - name: Commit the version bump
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          AFI_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # Nothing to commit means a previous run already landed this bump and
          # died before tagging. HEAD is that commit, which is what to tag.
          if git diff --quiet -- Cargo.toml Cargo.lock CHANGELOG.md; then
            echo "The bump for ${AFI_RELEASE_TAG} is already on main at $(git rev-parse HEAD)."
            exit 0
          fi
          oid="$(./scripts/commit-release.sh Cargo.toml Cargo.lock CHANGELOG.md)"
          echo "Committed ${oid} to main."
          # release-plz tags whatever is checked out, so move to the commit the
          # API just made. Without this the tag would point at the parent and the
          # released tarballs and packages would carry the previous version.
          git fetch origin main --quiet
          git reset --hard "${oid}" --quiet

      # release-plz creates the tag and the GitHub release, and fills the release
      # body with this version's changelog section. `git_release_draft` in
      # release-plz.toml keeps it unpublished until the verify job passes.
      - name: Tag and open the draft release
        env:
          # release-plz reads the release credential from GIT_TOKEN, not
          # GITHUB_TOKEN, and refuses to create a release without it. Passing only
          # GITHUB_TOKEN got as far as the bump commit and then failed with "git
          # release not configured", leaving a version on main with no tag.
          GIT_TOKEN: ${{ steps.token.outputs.token }}
          # The crate is published from this same step. The plan job has already
          # refused to get here without the token.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --forge is required alongside the token; release-plz infers it only
        # when driven by its own action, and this calls the CLI directly.
        run: mise x -- release-plz release --forge github

      - name: Collect the built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # Binds each artifact's digest to this workflow, this commit, and this
      # runner, signed by Sigstore. A user can then check where a binary came
      # from with `gh attestation verify`, which the checksums cannot answer:
      # they are uploaded by the same job that uploads the archives, so they
      # detect a corrupted download and nothing else.
      #
      # The checksum files themselves are not attested. Attesting a digest of a
      # digest states nothing the archive's own attestation does not.
      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb

      - name: Attach the artifacts to the draft release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # --clobber so re-running a release that failed after this point
          # replaces what it already uploaded instead of stopping.
          gh release upload "${TAG}" dist/* --clobber
          echo "Attached $(find dist -type f | wc -l) files to ${TAG}."

  apt:
    name: Publish to apt
    needs: [plan, release]
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    permissions:
      contents: read
      # Cloudsmith exchanges this token for a short-lived credential, so no
      # long-lived API key has to live in the repository secrets.
      id-token: write
    steps:
      - name: Collect the Debian packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Set up the Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@ad73fafb92e3e29a5166c529464c2df7658a608e # v3.1.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_WORKSPACE }}
          oidc-service-slug: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
          verify-auth: true

      # Both architectures from one job. They used to be pushed from separate
      # matrix legs with fail-fast off, which is how v0.2.0 published its arm64
      # package and silently never published amd64.
      - name: Push the Debian packages
        env:
          WORKSPACE: ${{ vars.CLOUDSMITH_WORKSPACE }}
          REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(dist/*.deb)
          if (( ${#debs[@]} == 0 )); then
            echo "::error::no .deb in the build artifacts"
            exit 1
          fi
          for deb in "${debs[@]}"; do
            # any-distro/any-version, not a codename: the package holds a static
            # binary and declares no dependencies, so one upload serves every
            # Debian and Ubuntu release. Cloudsmith then offers it under each
            # codename path its clients ask for.
            #
            # --republish so re-running a release that failed after this point
            # succeeds instead of stopping on "version already exists".
            echo "Pushing ${deb}"
            cloudsmith push deb \
              "${WORKSPACE}/${REPOSITORY}/any-distro/any-version" \
              "${deb}" \
              --republish
          done

  verify:
    name: Verify
    needs: [plan, release, apt]
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    permissions:
      # write rather than read because the release under inspection is still a
      # draft, and GitHub shows draft releases only to identities with push
      # access. Nothing in this job writes.
      contents: write
    steps:
      # The tag, so deb-version.sh reads the released version rather than main's.
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false

      - name: Reconcile the release against the apt repository
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDSMITH_WORKSPACE: ${{ vars.CLOUDSMITH_WORKSPACE }}
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: ./scripts/reconcile-release.sh "${TAG}" "$(./scripts/deb-version.sh)"

  publish:
    name: Publish
    needs: [plan, release, verify]
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    permissions:
      contents: write
    steps:
      # The one step that makes a release visible. Everything it publishes has
      # been built, run, packaged, installed in a clean container, pushed to apt,
      # and counted.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          args=(--draft=false)
          case "${VERSION}" in
            # A SemVer prerelease. Marked as one, and deliberately not marked
            # latest: `releases/latest` and a bare `apt-get install afi` should
            # keep pointing at the last stable version.
            *-*) args+=(--prerelease) ;;
            *)   args+=(--latest --prerelease=false) ;;
          esac
          gh release edit "${TAG}" "${args[@]}" --repo "${REPO}"
          echo "Published https://github.com/${REPO}/releases/tag/${TAG}"

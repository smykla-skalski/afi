name: release

# Releases decide their own version. release-plz reads the conventional-commit
# history, works out the next version from it, rewrites Cargo.toml, Cargo.lock,
# and CHANGELOG.md, tags, and writes that version's changelog into the release
# notes. Nobody edits a version by hand, so the manifest, the tag, the changelog,
# and the Debian packages cannot disagree about what shipped.
#
# Nothing becomes public until every artifact exists.
#
# That ordering is the whole design, and it is what the previous arrangement got
# backwards. It tagged and published a release first and built the binaries
# afterwards, so a release was live and empty for as long as the builds took, and
# a build that failed left the empty release behind. Measured on v0.4.0: the
# release was published at 20:37:48Z carrying one of the three platforms it
# shipped, and the last asset landed at 04:15:57Z the following morning. v0.3.0
# came out of the same hole with a tag and no release at all. So:
#
#   plan     work out the version and commit the bump. No tag, no release.
#   build    compile, smoke-test, and package every target. Nothing public.
#   release  tag, open a *draft* release, attach and attest.
#   apt      push the Debian packages.
#   verify   assert the release and the apt repository agree.
#   publish  flip the draft, then publish the crate. The first moment a user can
#            see anything, and the crate comes after everything reversible
#            because it is the one step of a release that cannot be undone.
#   homebrew ask the tap for a formula update, and wait until it has one. After
#            the crate, and in its own job: it publishes into another repository
#            and is the only step here anyone can put right afterwards by hand,
#            so it has no business standing between the release and the crate.
#
# The bump is committed in `plan`, before the build, and that is deliberate even
# though it is the one thing here that writes outside the runner early. The
# alternative was to build from an overlay of the bumped files on top of the
# previous commit, which leaves the working tree modified, and build.rs stamps a
# modified tree as "(dirty)". Every released binary would have reported itself
# dirty and named a commit that is not the one the tag points at. A version bump
# sitting on main is cheap by comparison, and plan-release.sh already treats "a
# manifest version with no tag" as its resume case.
#
# A failure anywhere before `publish` therefore leaves a bump commit on main, and
# from `release` onwards a tag and a draft. None of it is visible to anyone
# without push access. Re-running the workflow resumes.
#
# Daily rather than on every push to main: a release rebuilds five targets,
# packages two of them, and pushes to the apt repository, which is a lot of
# motion to attach to a single merge. Once a day collects a day's work into one
# version. On a quiet day the job finds nothing releasable and stops.
#
# `release_commits` in release-plz.toml decides what counts: feat, fix, perf, and
# refactor. docs, chore, test, style, and ci land on main and wait for the next
# release that something else triggers.
#
# The manual trigger is the escape hatch, for releasing off-schedule, pinning an
# exact version, or forcing one when the history says there is nothing to do.
# A dry run now runs plan and build in full, which proves every target still
# compiles, packages, and runs, and stops before anything is written.
#
# The target list lives in scripts/release-targets.sh, not here. The build matrix
# and the reconciliation gate both read it, so "what a release contains" has one
# definition instead of one in YAML and none anywhere else.
#
# The build itself lives in build-targets.yml, shared with backfill-release.yml,
# so a change to how a target is compiled, run, or packaged lands once.
#
# apt publishing setup, needed once before the first release that publishes:
#
#   1. Create a Cloudsmith workspace and an open-source repository in it. The
#      repository type has to be chosen at creation; it cannot be converted
#      afterwards, and deletion is soft, so the slug stays reserved.
#   2. Create a service account, give it write access to the repository, and add
#      a GitHub OIDC provider to it. Cloudsmith exchanges the token this workflow
#      requests for a short-lived credential, so there is no API key to store.
#   3. Set three repository variables: CLOUDSMITH_WORKSPACE,
#      CLOUDSMITH_REPOSITORY, CLOUDSMITH_SERVICE_SLUG.
#
# The plan job refuses to publish while any of those is unset, so a missing step
# fails before a tag exists rather than halfway through a release.
#
# Homebrew needs no setup here beyond the app key the plan job already checks.
# The formula and the workflow that rewrites it live in
# smykla-skalski/homebrew-tap; this workflow only dispatches to it and waits.
on:
  schedule:
    # 04:17 UTC. Off the hour on purpose: GitHub queues scheduled jobs across all
    # repositories, and the top of the hour is where everyone else is waiting.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version, no leading v (e.g. 0.3.0). Empty means work it out from the commits."
        required: false
        type: string
      force:
        description: "Release even when no commit since the last tag is releasable."
        type: boolean
        default: false
      dry_run:
        description: "Plan and build everything, publish nothing."
        type: boolean
        default: false

permissions:
  contents: read

# Two releases at once would race on the tag and on the version in Cargo.toml.
# Never cancel one in flight: it may already have pushed a tag or a package.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    permissions:
      contents: read
    outputs:
      released: ${{ steps.plan.outputs.released }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha || steps.plan.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # Deliberately unscoped, and zizmor is told so below.
      #
      # A `permission-contents: write` input mints a token carrying only that
      # permission, which reads like the safer choice and is not: the ruleset on
      # main lists this app as a bypass actor, and a scoped token does not get
      # the bypass. Measured. v0.4.0 and v0.5.0 were both cut with an unscoped
      # token; the first release after the input was added died in the plan job
      # with "protected branch 'main' check failed: Changes must be made through
      # a pull request", having written nothing, and the ruleset had not been
      # touched since before either of those releases.
      #
      # The exposure is real but small: the token lives for one job, and what it
      # can reach is bounded by the app's installation, which is this repository.
      - name: Mint an app token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
        with:
          client-id: ${{ vars.SMYKLOT_CLIENT_ID || 'Iv23liMyF31aNYay8IXy' }}
          private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}

      # Full history and tags: release-plz compares against the last tag to work
      # out what changed, so a shallow clone would make every release look like
      # the first one.
      #
      # The bump is committed through the API rather than pushed, so this
      # checkout keeps no credentials.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Everything a release needs in order to finish, asked for at the only
      # point where the answer is still free. The apt push happens after the tag
      # and the release exist, so a credential missing there would leave a
      # half-finished release behind rather than a failed run.
      - name: Check the publishing configuration
        env:
          CLOUDSMITH_WORKSPACE: ${{ vars.CLOUDSMITH_WORKSPACE }}
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
          CLOUDSMITH_SERVICE_SLUG: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
          APP_PRIVATE_KEY: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDSMITH_WORKSPACE}" ]] || missing+=(CLOUDSMITH_WORKSPACE)
          [[ -n "${CLOUDSMITH_REPOSITORY}" ]] || missing+=(CLOUDSMITH_REPOSITORY)
          [[ -n "${CLOUDSMITH_SERVICE_SLUG}" ]] || missing+=(CLOUDSMITH_SERVICE_SLUG)
          if (( ${#missing[@]} )); then
            echo "::error::missing repository variables: ${missing[*]}. See the apt setup notes in this file's header."
            exit 1
          fi

          secrets=()
          [[ -n "${APP_PRIVATE_KEY}" ]] || secrets+=(SMYKLOT_APP_PRIVATE_KEY)
          if (( ${#secrets[@]} )); then
            echo "::error::missing repository secrets: ${secrets[*]}"
            exit 1
          fi

          # Nothing is checked here about crates.io. The credential is a trusted
          # publishing exchange now, which leaves no secret for this job to look
          # for, and warning about the absent fallback would fire on every run.
          # The publish job fails outright when it can get no credential at all,
          # which is the check that can actually tell.

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # A release should not ship a tree the gate rejects, and this runs before
      # anything is written, tagged, or pushed.
      - name: Run the repository gate
        run: mise run check

      # Advisories and licenses are a property of the day, not of the commit: a
      # tree that passed yesterday can hold a crate that was advised against
      # overnight. Asking here means a release is the thing that notices.
      - name: Run the supply-chain gate
        run: mise run check:supply-chain

      - name: Work out the version
        id: plan
        env:
          AFI_RELEASE_VERSION: ${{ inputs.version }}
          AFI_RELEASE_FORCE: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Emitted before anything can decide not to release, because the build
          # job interpolates it into `strategy.matrix` and `fromJSON` of an empty
          # string is an error. A job that is skipped should be skipped, not fail
          # while working out how many copies of itself not to run.
          echo "matrix={\"include\":$(./scripts/release-targets.sh --matrix)}" >>"${GITHUB_OUTPUT}"

          # Exit 3 is "nothing releasable", the ordinary outcome of a quiet day.
          set +e
          version="$(mise x -- ./scripts/plan-release.sh)"
          status=$?
          set -e
          if (( status == 3 )); then
            echo "released=false" >>"${GITHUB_OUTPUT}"
            echo "No releasable commit since the last tag. Nothing to do."
            exit 0
          fi
          (( status == 0 )) || exit "${status}"

          # Asked of the API rather than of `git ls-remote`, because the checkout
          # above keeps no credentials and this should not depend on the
          # repository happening to be public.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            echo "::error::Tag v${version} already exists."
            exit 1
          fi

          {
            echo "released=true"
            echo "version=${version}"
            echo "tag=v${version}"
            # Only used by a dry run, which does not commit. Every other path
            # overrides this with the bump commit made below.
            echo "sha=$(git rev-parse HEAD)"
          } >>"${GITHUB_OUTPUT}"
          echo "Releasing ${version} from $(git rev-parse --short HEAD)."

      - name: Show the planned release
        if: steps.plan.outputs.released == 'true'
        run: git --no-pager diff --stat

      # Through the API rather than git, because the ruleset requires signed
      # commits and a runner has no key to sign with. GitHub signs commits it
      # creates, so the rule is satisfied outright instead of relying on the app
      # being exempt from it. The app's bypass then covers only the missing pull
      # request, which is the one rule it has to.
      #
      # `expectedHeadOid` is this checkout's HEAD, so the mutation is rejected if
      # main moved while the gate was running. That is what stops a release from
      # silently building one tree and tagging another.
      - name: Commit the version bump
        id: commit
        if: steps.plan.outputs.released == 'true' && !inputs.dry_run
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          AFI_RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # Nothing to commit means a previous run already landed this bump and
          # died before tagging. HEAD is that commit, which is what to build.
          if git diff --quiet -- Cargo.toml Cargo.lock CHANGELOG.md; then
            oid="$(git rev-parse HEAD)"
            echo "The bump for ${AFI_RELEASE_TAG} is already on main at ${oid}."
          else
            oid="$(./scripts/commit-release.sh Cargo.toml Cargo.lock CHANGELOG.md)"
            echo "Committed ${oid} to main."
          fi
          echo "sha=${oid}" >>"${GITHUB_OUTPUT}"

      # A dry run has no commit to build, so the build jobs get the bumped files
      # as an artifact and lay them over the previous commit instead. That leaves
      # the tree modified and the binaries stamped "(dirty)", which is why it is
      # the dry-run path and not the release one.
      - name: Upload the version bump
        if: steps.plan.outputs.released == 'true' && inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bump
          path: |
            Cargo.toml
            Cargo.lock
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.released == 'true'
    # Shared with backfill-release.yml. The matrix, the smoke test, the packaging
    # and the artifact layout all live there, so a change to any of them lands
    # once rather than in two places that have to be kept identical by hand.
    uses: ./.github/workflows/build-targets.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
      version: ${{ needs.plan.outputs.version }}
      matrix: ${{ needs.plan.outputs.matrix }}
      # Only a dry run needs the overlay: it skips the bump commit, so the tree
      # at `sha` still carries the previous version.
      bump-artifact: ${{ inputs.dry_run && 'release-bump' || '' }}

  release:
    name: Tag and draft
    needs: [plan, build]
    # A dry run stops here. Everything above it has already proved the release
    # would work; everything below it changes something outside the runner.
    if: needs.plan.outputs.released == 'true' && !inputs.dry_run
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    permissions:
      contents: write
      # Sigstore issues the short-lived certificate that signs the provenance.
      id-token: write
      attestations: write
    steps:
      # release-plz pushes the tag, which the branch ruleset would otherwise
      # forbid. This app is a bypass actor on that ruleset. GITHUB_TOKEN is not.
      #
      # Deliberately unscoped, and zizmor is told so below.
      #
      # A `permission-contents: write` input mints a token carrying only that
      # permission, which reads like the safer choice and is not: the ruleset on
      # main lists this app as a bypass actor, and a scoped token does not get
      # the bypass. Measured. v0.4.0 and v0.5.0 were both cut with an unscoped
      # token; the first release after the input was added died in the plan job
      # with "protected branch 'main' check failed: Changes must be made through
      # a pull request", having written nothing, and the ruleset had not been
      # touched since before either of those releases.
      #
      # The exposure is real but small: the token lives for one job, and what it
      # can reach is bounded by the app's installation, which is this repository.
      - name: Mint an app token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 # zizmor: ignore[github-app]
        with:
          client-id: ${{ vars.SMYKLOT_CLIENT_ID || 'Iv23liMyF31aNYay8IXy' }}
          private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}

      # The branch, not the commit. release-plz asks git for the current branch's
      # upstream before it does anything, and a checkout by sha leaves a detached
      # HEAD, so it stops with "cannot determine current branch" -- measured, on
      # the first real run of this pipeline.
      #
      # Credentials stay on this checkout on purpose: release-plz pushes the tag
      # over git, so removing them would break the one job that needs them. This
      # is the only job in the workflow that keeps them.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      # release-plz tags whatever is checked out, and what has to be tagged is
      # the commit the build compiled. Moving the local branch rather than
      # detaching keeps HEAD attached, which is the part release-plz needs.
      #
      # Normally a no-op: `sha` is main's tip, because plan committed the bump
      # there and nothing else landed in between. When something did land, this
      # tags what was actually built and leaves the newer commits for the next
      # release, rather than tagging code no build ever saw.
      - name: Point the branch at the commit that was built
        env:
          BUILT: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [[ "${head}" == "${BUILT}" ]]; then
            echo "main is at ${BUILT}, the commit the build used."
            exit 0
          fi
          echo "::warning::main has moved to ${head} since the build; tagging ${BUILT}, which is what was compiled."
          git reset --hard "${BUILT}" --quiet
          git --no-pager log --oneline -1

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # release-plz creates the tag and the GitHub release, and fills the release
      # body with this version's changelog section. `git_release_draft` in
      # release-plz.toml keeps it unpublished until the verify job passes, and
      # `publish = false` keeps it away from crates.io: the crate is the one
      # thing here that cannot be undone, so it is published last, by the publish
      # job, once everything reversible has already succeeded.
      - name: Tag and open the draft release
        env:
          # release-plz reads the release credential from GIT_TOKEN, not
          # GITHUB_TOKEN, and refuses to create a release without it. Passing only
          # GITHUB_TOKEN got as far as the bump commit and then failed with "git
          # release not configured", leaving a version on main with no tag.
          GIT_TOKEN: ${{ steps.token.outputs.token }}
        # --forge is required alongside the token; release-plz infers it only
        # when driven by its own action, and this calls the CLI directly.
        run: mise x -- release-plz release --forge github

      - name: Collect the built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # Binds each artifact's digest to this workflow, this commit, and this
      # runner, signed by Sigstore. A user can then check where a binary came
      # from with `gh attestation verify`, which the checksums cannot answer:
      # they are uploaded by the same job that uploads the archives, so they
      # detect a corrupted download and nothing else.
      #
      # The checksum files themselves are not attested. Attesting a digest of a
      # digest states nothing the archive's own attestation does not.
      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb

      - name: Attach the artifacts to the draft release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # --clobber so re-running a release that failed after this point
          # replaces what it already uploaded instead of stopping.
          gh release upload "${TAG}" dist/* --clobber
          echo "Attached $(find dist -type f | wc -l) files to ${TAG}."

  apt:
    name: Publish to apt
    # `plan` arrives transitively through `release`; naming it here too would
    # suggest this job reads a plan output, which it does not.
    needs: release
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    permissions:
      contents: read
      # Cloudsmith exchanges this token for a short-lived credential, so no
      # long-lived API key has to live in the repository secrets.
      id-token: write
    steps:
      # The narrow `deb-*` artifacts, not `dist-*`: this job wants two packages
      # and the wider pattern would pull five tarballs and five checksums to
      # find them.
      - name: Collect the Debian packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist

      - name: Set up the Cloudsmith CLI
        uses: cloudsmith-io/cloudsmith-cli-action@ad73fafb92e3e29a5166c529464c2df7658a608e # v3.1.0
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_WORKSPACE }}
          oidc-service-slug: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
          verify-auth: true

      # Both architectures from one job. They used to be pushed from separate
      # matrix legs with fail-fast off, which is how v0.2.0 published its arm64
      # package and silently never published amd64.
      - name: Push the Debian packages
        env:
          WORKSPACE: ${{ vars.CLOUDSMITH_WORKSPACE }}
          REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(dist/*.deb)
          if (( ${#debs[@]} == 0 )); then
            echo "::error::no .deb in the build artifacts"
            exit 1
          fi
          for deb in "${debs[@]}"; do
            # any-distro/any-version, not a codename: the package holds a static
            # binary and declares no dependencies, so one upload serves every
            # Debian and Ubuntu release. Cloudsmith then offers it under each
            # codename path its clients ask for.
            #
            # --republish so re-running a release that failed after this point
            # succeeds instead of stopping on "version already exists".
            echo "Pushing ${deb}"
            cloudsmith push deb \
              "${WORKSPACE}/${REPOSITORY}/any-distro/any-version" \
              "${deb}" \
              --republish
          done

  verify:
    name: Verify
    needs: [plan, apt]
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    permissions:
      # write rather than read because the release under inspection is still a
      # draft, and GitHub shows draft releases only to identities with push
      # access. Nothing in this job writes.
      contents: write
    steps:
      # The tag, so deb-version.sh reads the released version rather than main's.
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false

      - name: Reconcile the release against the apt repository
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDSMITH_WORKSPACE: ${{ vars.CLOUDSMITH_WORKSPACE }}
          CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: ./scripts/reconcile-release.sh "${TAG}" "$(./scripts/deb-version.sh)"

  publish:
    name: Publish
    needs: [plan, verify]
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    permissions:
      contents: write
      # crates.io exchanges this for a short-lived publishing token. See the
      # trusted-publishing step below.
      id-token: write
    steps:
      # The step that makes the release visible. Everything it publishes has been
      # built, run, packaged, installed in a clean container, pushed to apt, and
      # counted.
      #
      # Reversible, and therefore first: a release that should not have gone out
      # can be turned back into a draft with `gh release edit --draft=true`. The
      # crate below cannot be taken back at all, so it goes after this, once the
      # last thing that could still fail has succeeded.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # Only `--latest` is decided here. Whether the release is a
          # prerelease was already settled by `git_release_type = "auto"` in
          # release-plz.toml, which reads the same version; re-deriving it would
          # put the same predicate in two places.
          #
          # A SemVer prerelease is deliberately not marked latest, so
          # `releases/latest` keeps pointing at the last stable version.
          args=(--draft=false)
          [[ "${VERSION}" == *-* ]] || args+=(--latest)
          gh release edit "${TAG}" "${args[@]}" --repo "${REPO}"
          echo "Published https://github.com/${REPO}/releases/tag/${TAG}"

      # The tag, so the crate is built from exactly what shipped.
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      # Trusted publishing: crates.io takes this job's OIDC identity and returns
      # a token that lasts 30 minutes and is revoked when the job ends. The same
      # model the apt push already uses for Cloudsmith, and for the same reason --
      # no long-lived credential sitting in the repository secrets.
      #
      # It cannot be configured until the crate exists, because the trust is
      # registered against a crate you already own. So this is allowed to fail
      # and the step below falls back to the stored token, which is what gets
      # `afi-cli` published the first time. Once trusted publishing is set up and
      # the token revoked, the fallback stops existing and the failure is real.
      - name: Exchange an OIDC token for a crates.io token
        id: crates-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Last, because it is the only publication a release cannot undo. A crate
      # can be yanked, which stops new dependents resolving to it, but it can
      # never be removed. publish-crate.sh is a no-op when the version is already
      # on crates.io, so re-running a half-finished release resumes here.
      - name: Publish the crate
        env:
          OIDC_TOKEN: ${{ steps.crates-auth.outputs.token }}
          STORED_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # Which credential was used is worth saying out loud. A silent fallback
          # would let a broken trusted-publishing setup keep working off the
          # long-lived token without anyone noticing it had stopped being used.
          if [[ -n "${OIDC_TOKEN}" ]]; then
            echo "Authenticated to crates.io by trusted publishing."
            export CARGO_REGISTRY_TOKEN="${OIDC_TOKEN}"
          elif [[ -n "${STORED_TOKEN}" ]]; then
            echo "::warning::Trusted publishing is not configured for this crate. Falling back to the stored CARGO_REGISTRY_TOKEN. Set it up at https://crates.io/crates/afi-cli/settings/trusted-publishing and revoke the token."
            export CARGO_REGISTRY_TOKEN="${STORED_TOKEN}"
          else
            echo "::error::No crates.io credential. Trusted publishing is not configured and CARGO_REGISTRY_TOKEN is unset."
            exit 1
          fi
          mise run publish:crate

  homebrew:
    name: Update the Homebrew formula
    needs: [plan, publish]
    runs-on: ${{ fromJSON(vars.RUNNER_LABEL || '["ubuntu-24.04"]') }}
    # The tap installs the formula on a macOS runner to prove it works, which is
    # the slow part of what this job waits for. This is the backstop under the
    # script's own deadline.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # Scoped to one repository and two permissions, unlike the tokens the plan
      # and release jobs mint. Those push to a branch whose ruleset this app
      # bypasses, and a permission-scoped token loses the bypass; this one only
      # sends a dispatch and reads, so no ruleset is involved. `actions: read`
      # is for the run status the script reports on.
      - name: Mint a token for the tap
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SMYKLOT_CLIENT_ID || 'Iv23liMyF31aNYay8IXy' }}
          private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}
          owner: smykla-skalski
          repositories: homebrew-tap
          permission-contents: write
          permission-actions: read

      # The workflow's own ref, not the release tag, because what is wanted here
      # is the current tooling. A fix to publish-homebrew.sh should apply the
      # next time this is re-run, not only to releases cut after it. Same reason
      # build-targets.yml takes the target list and the smoke test from the
      # caller's ref rather than from the commit it is building.
      - name: Check out the tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script dispatches to the tap and then waits for Formula/afi.rb to
      # name this release, because a dispatch is accepted whether or not any
      # workflow matches it. It skips a prerelease rather than failing on one.
      # See its header, and update-afi-formula.yml in the tap for the other end.
      - name: Update the Homebrew formula
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: ./scripts/publish-homebrew.sh "${VERSION}"

# Repo-local mise task lane for AFI.
#
# Per AGENTS.md, every repository command runs through `mise run <task>`;
# agents never invoke raw `cargo` or `xcodebuild`. Each task below wraps the
# underlying cargo command so the lane is the single entry point.
#
# This is the Phase 0 validation bootstrap only. Clippy runs with default
# lints here on purpose -- the strict Cargo `[lints]` policy and `clippy.toml`
# land in a later lane, after the dependency, unsafe, and Ratatui migrations.
# The toolchain is left on the repo's existing `rust-toolchain.toml` channel
# (`stable`); Harness pins a dated nightly for its own edition-2024 and cache
# reasons, which do not apply to AFI (edition 2021, no nightly features), so
# no pin is transplanted here.

[tasks.fmt]
description = "Apply rustfmt to all Rust sources"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Verify rustfmt formatting without writing changes"
run = "cargo fmt --all --check"

[tasks."check:rust"]
description = "Run clippy across all targets (default lints for now)"
run = "cargo clippy --all-targets"

[tasks.test]
description = "Run the repository test suite"
run = "cargo test"

[tasks."check:source-size"]
description = "Fail if any Rust source file exceeds the 420-line cap"
run = "./scripts/check-rust-source-size.sh"

[tasks."check:deps"]
description = "Check the dependency tree for advisories, licenses, bans, and sources"
# No flags: `deny.toml` holds the policy, including `all-features` and the target
# scoping. Passing any of it here too would put the same setting in two places.
run = "cargo-deny check"

[tasks."check:dist"]
description = "Assert deny.toml and install.sh agree with the release target list"
run = "./scripts/check-dist-consistency.sh"

[tasks."check:workflows"]
description = "Static-analyse the GitHub Actions workflows"
# Two tools, because they answer different questions. actionlint parses the YAML
# and the `${{ }}` expressions and rejects a workflow that would fail at dispatch
# time -- an unknown context, a bad `needs` reference, a matrix key nothing
# defines. zizmor asks whether a workflow that runs correctly is safe: template
# injection, overscoped tokens, unpinned actions, credential persistence.
#
# The release workflow mints an app token, writes to the default branch, and
# exchanges an OIDC token for a publishing credential, and until now nothing
# checked any of it. `.github/zizmor.yml` records what is excluded and why.
run = [
  "actionlint",
  "zizmor --persona=regular .github/workflows",
]

[tasks.check]
description = "Aggregate strict validation gate: format, clippy, source size, tests"
depends = ["fmt:check", "check:rust", "check:source-size", "test"]

[tasks."check:supply-chain"]
description = "Aggregate supply-chain gate: dependency policy, distribution consistency, workflow analysis"
# Separate from `check` on purpose. `check` answers "is this code correct" and
# runs on every edit; this one answers "is what we ship trustworthy" and depends
# on an advisory database that changes without the repository changing, so a
# green run yesterday says nothing about today.
depends = ["check:deps", "check:dist", "check:workflows"]

[tasks."lint:fix"]
description = "Format and apply machine-applicable clippy fixes across all targets"
run = [
  "cargo fmt --all",
  "cargo clippy --fix --allow-dirty --allow-staged --all-targets",
]

[tasks.install]
description = "Install the current afi binary into the standard Cargo bin directory for terminal use"
# --path . installs this local package; --locked pins to Cargo.lock; --force
# overwrites any previously installed afi safely; --bin afi selects the binary.
run = "cargo install --path . --locked --force --bin afi"

# Debian packaging lane.
#
# cargo-deb is pinned so a release and a local run produce the same package
# layout. It belongs in this repository-wide table rather than scoped to the deb
# task: a task-scoped `tools` entry is never provisioned, and mise reports it as
# "installed but not activated" while the task dies on `cargo-deb: command not
# found`. `mise install` picks it up from here, which is what jdx/mise-action
# runs in CI; run it once yourself if your mise config has auto_install off.
# It is a ~12s from-source build, cached after that, because upstream publishes
# release binaries only as an amd64 .deb.
[tools]
"cargo:cargo-deb" = "3.7.0"
# release-plz decides the next version from the conventional-commit history,
# rewrites CHANGELOG.md, tags, and writes the release notes. Pinned so a release
# cannot change shape because upstream shipped while nobody was looking. It
# installs from a prebuilt binary, so this one is quick.
release-plz = "0.3.160"
# cargo-deny reads the whole dependency graph and applies `deny.toml`: RustSec
# advisories, license allow-list, duplicate versions, and registry sources.
# Pinned like the rest so a gate cannot start failing because upstream shipped.
# From aqua rather than `cargo:`, which would build it from source: that took 73
# seconds, on every job that installs the lane, every time this file changes.
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
# zizmor audits the workflow YAML itself for template injection, overscoped
# tokens, unpinned actions, and impostor commits.
zizmor = "1.29.0"
# actionlint type-checks the workflow expressions and the shell inside `run:`.
actionlint = "1.7.7"

[tasks.dist]
description = "Build and pack a release archive the way a release does (arg: target triple)"
run = "./scripts/build-archive.sh"

[tasks.smoke]
description = "Unpack a release archive and prove the binary in it runs and self-reports correctly (args: archive, target, version)"
run = "./scripts/smoke-archive.sh"

[tasks."publish:crate"]
description = "Publish the crate to crates.io, unless that version is already there"
run = "./scripts/publish-crate.sh"

[tasks."deb:version"]
description = "Print the Debian package version derived from Cargo.toml"
run = "./scripts/deb-version.sh"

[tasks.deb]
description = "Package an already-built release binary as a .deb (arg: target triple)"
run = "./scripts/build-deb.sh"

[tasks."deb:verify"]
description = "Install a .deb in a clean container from a signed local apt repository (arg: .deb path)"
run = "./scripts/verify-deb.sh"

[package]
name = "minion"
version = "0.1.0"
edition = "2021"
authors = ["Sentdex", "smykla-skalski"]
license = "MIT"
description = "A deliberately tiny coding agent for self-hosted or remote models."
repository = "https://github.com/smykla-skalski/minion-rs"

[[bin]]
name = "minion"
path = "src/main.rs"

[lib]
name = "minion"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
dirs = "5"
anyhow = "1"
thiserror = "1"
chrono = "0.4"
nix = { version = "0.29", features = ["process", "signal", "fs"] }
once_cell = "1"

[dev-dependencies]
tempfile = "3"

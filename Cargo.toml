[package]
name = "afi"
version = "0.1.0"
edition = "2021"
authors = ["Sentdex", "smykla-skalski"]
license = "MIT"
description = "A deliberately tiny coding agent for self-hosted or remote models."
repository = "https://github.com/smykla-skalski/afi"

[[bin]]
name = "afi"
path = "src/main.rs"

[lib]
name = "afi"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "6"
thiserror = "2"
chrono = "0.4"
nix = { version = "0.31", features = ["process", "signal", "fs"] }
once_cell = "1"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[package]
name = "afi"
version = "0.2.0"
edition = "2024"
authors = ["Sentdex", "smykla-skalski"]
license = "MIT"
description = "A deliberately tiny coding agent for self-hosted or remote models."
repository = "https://github.com/smykla-skalski/afi"

[[bin]]
name = "afi"
path = "src/main.rs"

[lib]
name = "afi"
path = "src/lib.rs"

# Debian packaging, consumed by cargo-deb through `mise run deb`.
#
# `maintainer` is set explicitly because cargo-deb would otherwise take the
# first entry of `authors`, and the Maintainer field names whoever answers for
# *this package*, not whoever wrote the code.
#
# `depends` is empty rather than left to cargo-deb's dpkg-shlibdeps probe. The
# package wraps the static musl binary, which links nothing at runtime, so the
# probe has no shared objects to inspect and an inferred glibc floor would only
# refuse installs that would in fact work.
[package.metadata.deb]
maintainer = "Bart Smykla <bartek@smykla.com>"
copyright = "2025 Smykla Skalski"
license-file = ["LICENSE", "0"]
depends = ""
section = "utils"
priority = "optional"
extended-description = """
afi is a terminal coding agent for self-hosted and remote models. It speaks the \
OpenAI-compatible /chat/completions protocol used by llama.cpp, vLLM, SGLang, \
Z.ai, OpenAI, and OpenRouter, as well as Anthropic's native Messages API, and \
gives you an agent that reads, writes, edits, and runs shell commands in the \
current project.
"""
assets = [
  ["target/release/afi", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/afi/README.md", "644"],
  ["CHANGELOG.md", "usr/share/doc/afi/CHANGELOG.md", "644"],
  ["docs/reference.md", "usr/share/doc/afi/reference.md", "644"],
  ["sources.example.env", "usr/share/doc/afi/sources.example.env", "644"],
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dirs = "6"
thiserror = "2"
chrono = "0.4"
nix = { version = "0.31", features = ["process", "signal", "fs"] }
once_cell = "1"
# `--version` digests the running executable. Already in the tree through rustls,
# so this pulls in nothing new.
sha2 = "0.10"
reqwest = { version = "0.13", features = ["json", "rustls", "stream"], default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
async-trait = "0.1"
futures = "0.3"
ratatui = { version = "0.30.2", features = ["crossterm_0_29", "unstable-rendered-line-info"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui-textarea = "0.9.2"
throbber-widgets-tui = "0.11.1"
tui-markdown = { version = "0.3.8", default-features = false }
unicode-segmentation = "1.13"

[dev-dependencies]
tempfile = "=3.27.0"

# Highest-strict Harness-equivalent lint policy, adapted for AFI. Strictness
# is delivered through the manifest (no `-D warnings` needed): `pedantic` denies
# the whole group at priority 1, with targeted restriction/nursery/perf lints
# promoted to deny at priority 2. `unexpected_cfgs` from Harness is omitted --
# AFI defines no Cargo features and no custom `cfg` values (only `cfg(test)`).
[lints.clippy]
pedantic = { level = "deny", priority = 1 }
absolute_paths = { level = "deny", priority = 2 }
cognitive_complexity = { level = "deny", priority = 2 }
needless_pass_by_value = { level = "deny", priority = 2 }
ptr_arg = { level = "deny", priority = 2 }
redundant_clone = { level = "deny", priority = 2 }
unnecessary_to_owned = { level = "deny", priority = 2 }

[lints.rust]
unused = { level = "deny", priority = 1 }

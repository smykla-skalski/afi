# Dependency policy, enforced by `mise run check:deps`.
#
# Four questions, all of which used to go unasked: does the tree contain a known
# advisory, does every crate carry a license afi may ship, are there duplicate
# versions of the same crate, and does anything come from a registry other than
# crates.io.

[graph]
# Scoped to the triples afi actually publishes, not to every target Cargo knows
# about, because the policy should describe what ships. An unscoped check also
# drags in target-conditional crates that are never compiled, never linked, and
# never distributed -- getrandom's UEFI backend and the Windows API bindings
# among them.
#
# This list has to match scripts/release-targets.sh, and `mise run check:dist`
# asserts that it does. Drift here would be silent and would weaken the gate: a
# target in the matrix but not here has its dependencies checked by nothing.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
# Check the graph with every Cargo feature enabled, so a dependency that only
# appears behind an optional feature is still covered.
all-features = true

[advisories]
# RustSec, refreshed on every run. `version = 2` is the current schema, and is
# stated rather than defaulted so a cargo-deny upgrade cannot change the meaning
# of this file without the change being visible here.
version = 2
# A yanked dependency is a release hazard on its own: the version resolves today
# from the local cache and stops resolving for anyone building fresh.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only, plus the one special case noted below. Anything not
# on this list fails the gate rather than being waved through, so a new
# dependency that changes afi's own distribution terms has to be looked at.
#
# Only licenses actually present in the shipped graph are listed. An allowance
# for something absent is reported as unmatched on every run, and a gate that
# always prints warnings is a gate people stop reading.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  # option-ext, reached through dirs -> dirs-sys, and the only copyleft license
  # in the shipped graph. MPL-2.0 is per-file: it obliges anyone distributing a
  # modified version of those files to publish them, and afi modifies nothing.
  # Linking it into a statically-linked MIT binary is what the license is written
  # to permit, so this is an allow rather than an exception.
  "MPL-2.0",
  # The ICU crates that url and idna pull in.
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicates are a warning, not an error. They arrive through transitive
# dependencies afi does not control, and the cost is binary size rather than
# correctness, so failing a release over one would be a gate nobody could clear.
multiple-versions = "warn"
wildcards = "deny"
# Nothing here is banned outright yet. Add a crate with a `reason` when there is
# a specific one to keep out, not pre-emptively.
deny = []

[sources]
# Every crate has to come from crates.io. A git dependency or a private registry
# would be a supply-chain change that no review currently forces anyone to see.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Release automation. release-plz reads the conventional-commit history, decides
# the next version, rewrites CHANGELOG.md, tags, and writes the release notes.
#
# Nothing here is a version number: the version lives in Cargo.toml and is
# rewritten by the release job, so no human edits it and the manifest, the tag,
# the changelog, and the Debian package can never disagree.

[workspace]

# The crates.io name `afi` belongs to an unrelated audio/video crate published in
# 2017, so the package is `afi-cli` and the binary it installs is still `afi`.
# A release is four publications: the GitHub release and its archives, the
# Debian packages in the apt repository, the crate, and the Homebrew formula in
# smykla-skalski/homebrew-tap.
#
# release-plz does not publish the crate, though. The release workflow's own
# `publish` job does, last, after the reconciliation gate has passed. Two reasons,
# and both were found by review rather than by reasoning:
#
#   1. Ordering. release-plz publishes in the same step that creates the tag,
#      which is three jobs before anything else goes public. A failure in `apt`
#      or `verify` after that point would leave `cargo install afi-cli` serving a
#      version worldwide while the GitHub release was still a draft -- and a
#      crate cannot be unpublished, only yanked. The one irreversible publication
#      belongs at the end, not in the middle.
#
#   2. It does not work here yet. `release-plz update` refuses to compute a next
#      version when a package is absent from the registry but a matching git tag
#      exists, which is exactly the state a rename creates: v0.5.0 is tagged and
#      `afi-cli` has never been published. With `publish = true` the plan job
#      exits 1 on every run until someone publishes by hand.
#
# scripts/publish-crate.sh does it instead, and is a no-op when the version is
# already on crates.io, so a re-run of a half-finished release resumes.
publish = false

# afi exposes a lib target, but only so the binary and the tests can share code.
# It is not an API anyone depends on, so a semver check on it would block
# releases over changes that cannot affect a user.
semver_check = false

# In 0.x, semver leaves the meaning of a minor bump to the project. Treating
# features as minor keeps the minor number as the release train and the patch
# number for fixes, which is how this project has moved so far. Breaking changes
# also land on minor, because below 1.0 nothing is promised stable.
features_always_increment_minor = true

# Only changes a user could notice cut a release. docs, chore, test, style, and
# ci land on main and wait, then appear in the changelog of whatever release
# comes next. Without this, a README typo would ship a version, rebuild every
# Debian package, and push them to the apt repository.
release_commits = "^(feat|fix|perf|refactor)"

# Created unpublished. The release workflow attaches the archives and the Debian
# packages, pushes to apt, reconciles the two against the target list, and only
# then flips the draft. Everything before that point is invisible to anyone
# without push access.
#
# This is what stops the failure the first four releases all hit in some form: a
# published release that exists before its binaries do. It is also the ordering
# GitHub's immutable releases require, since a published immutable release can
# never gain another asset.
git_release_draft = true

# "auto" reads the version: 0.5.0-rc.1 is marked a prerelease, 0.5.0 is not.
# deb-version.sh already translates a SemVer prerelease into a Debian version
# that dpkg sorts below the stable one, so the two halves of a prerelease agree
# without anyone having to remember.
git_release_type = "auto"

# Not set as latest here, because GitHub refuses to mark a draft latest. The
# publish job does it at the same moment it flips the draft.
git_release_latest = false

# The release notes are that version's changelog section, so the GitHub release
# and CHANGELOG.md cannot drift apart, followed by how to install and how to
# check that what you downloaded came from this workflow. A release page that
# only lists changes makes every reader go and find the README.
git_release_body = """
{{ changelog }}

## Install

Homebrew, on macOS and Linux:

```
brew install smykla-skalski/tap/afi
```

Debian and Ubuntu, amd64 and arm64:

```
curl -1sLf 'https://dl.cloudsmith.io/public/smykla-skalski/afi/setup.deb.sh' | sudo -E bash
sudo apt-get install afi
```

Linux and macOS, without a package manager:

```
curl -fsSL https://raw.githubusercontent.com/smykla-skalski/afi/main/scripts/install.sh | sh
```

From crates.io:

```
cargo install afi-cli --locked
```

Or take an archive from the assets below: `x86_64` and `aarch64` for Linux
(static musl builds, plus a glibc build for x86_64) and for macOS.

## Verify

Every archive and package below is signed with build provenance, so you can
check it was produced by this repository's release workflow rather than merely
that it downloaded intact:

```
gh attestation verify <file> --repo smykla-skalski/afi
```
"""

[changelog]
protect_breaking_commits = true

# Matches the format the existing entries were generated in, so the file reads as
# one document rather than as a default template layered over a different one.
# release-plz's own default renders the scope in italics and leaves the subject
# lowercase; this uses bold and sentence case, like the rest of the file.
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]{% if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{%- else -%}
## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""

# Grouped by what a reader wants to find, not by the commit type alphabet.
# `default_scope` is unset on purpose: a scope is mandatory in this repository,
# so anything without one is a mistake worth seeing in the changelog.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  # Housekeeping that never reaches a user. Skipped rather than grouped, so the
  # changelog stays a description of the software instead of the repository.
  { message = "^chore", skip = true },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
]
